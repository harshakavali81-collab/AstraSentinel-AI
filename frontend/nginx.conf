# Browser security headers and lightweight API request bounds.
# Defense in depth only: public deployment still requires authentication and TLS.
limit_req_zone $binary_remote_addr zone=astrasentinel_api:10m rate=10r/s;

server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  location /api/ {
    limit_req zone=astrasentinel_api burst=20 nodelay;
    client_max_body_size 32k;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 45s;
    proxy_send_timeout 45s;
  }

  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
