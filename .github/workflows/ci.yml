name: AstraSentinel CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install scientific and testing dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run deterministic offline test suite
        env:
          ASTRA_OFFLINE: '1'
        run: python -m pytest tests -v --cov=astrasentinel --cov-report=term-missing
      - name: Generate downloadable scientific demo artifacts
        env:
          ASTRA_OFFLINE: '1'
        run: python -m scripts.generate_demo_artifacts --output artifacts/reports
      - name: Publish demo CSV, JSON and SVG as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: astrasentinel-scientific-demo
          path: artifacts/reports/
          if-no-files-found: error
          retention-days: 30
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Test chart interpolation and browser-independent frontend logic
        run: npm test
      - name: Build production dashboard
        run: npm run build

  full-stack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the complete app using Docker
        env:
          ASTRA_OFFLINE: '1'
        run: docker compose up --build --detach
      - name: Smoke-test running backend, reverse-proxied frontend and scientific endpoints
        run: |
          set -eu
          ready=0
          for attempt in $(seq 1 65); do
            if curl --silent --fail http://localhost:8000/api/health >/dev/null &&
               curl --silent --fail http://localhost:3000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          curl --silent --fail http://localhost:3000/ | grep -q "AstraSentinel AI"
          python3 - <<'PY'
          import json, urllib.request
          def get(path):
              with urllib.request.urlopen('http://localhost:3000'+path, timeout=30) as response:
                  return json.load(response)
          assert get('/api/health')['ok']
          orbit = get('/api/orbit')
          weather = get('/api/weather')
          model = get('/api/model/evaluation')
          rocket = get('/api/rocket/demo')
          report = get('/api/mission/report')
          assert len(orbit['points']) == 121
          assert orbit['status'] == 'demo'
          assert weather['status'] == 'demo'
          assert model['label_source'] == 'controlled_synthetic_injections'
          assert rocket['metrics']['apogee_km'] > 0
          request = urllib.request.Request(
              'http://localhost:3000/api/rocket/compare',
              data=json.dumps({'parameter':'density_multiplier',
                               'values':[0.5, 1.0, 2.0]}).encode(),
              headers={'Content-Type':'application/json'},
              method='POST')
          with urllib.request.urlopen(request, timeout=30) as response:
              scenario_study = json.load(response)
          assert len(scenario_study['scenarios']) == 3
          assert scenario_study['scenarios'][0]['metrics']['apogee_km'] > scenario_study['scenarios'][2]['metrics']['apogee_km']
          assert report['telemetry_ai']['live_spacecraft_telemetry'] is False
          print('Complete offline container smoke-test passed.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser-test dependencies
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Capture actual browser screenshots and verify interactive workflows
        working-directory: frontend
        run: npm run test:e2e
      - name: Publish real dashboard screenshot and failure trace artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astrasentinel-browser-e2e
          path: |
            frontend/artifacts/browser-screenshots/
            frontend/artifacts/test-results/
            frontend/artifacts/playwright-report/
          if-no-files-found: warn
          retention-days: 30
      - name: Dump application logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Stop test containers
        if: always()
        run: docker compose down --remove-orphans
