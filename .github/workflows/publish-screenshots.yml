name: Publish real dashboard screenshots

# Publish only screenshots from a completed, successful MAIN push workflow.
# workflow_run is privileged: never checkout or execute code from external PRs.
on:
  workflow_run:
    workflows: ["AstraSentinel CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: astrasentinel-screenshots-main
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Find the verified CI workflow run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            latest=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')
          else
            latest="$EVENT_RUN"
          fi
          test "$latest" != "null" && test -n "$latest"
          echo "run_id=$latest" >> "$GITHUB_OUTPUT"
      - name: Download authentic Chromium screenshots from that successful run
        uses: actions/download-artifact@v4
        with:
          name: astrasentinel-browser-e2e
          run-id: ${{ steps.run.outputs.run_id }}
          github-token: ${{ github.token }}
          path: incoming
      - name: Download deterministic physics reports and SVG scientific graphs
        uses: actions/download-artifact@v4
        with:
          name: astrasentinel-scientific-demo
          run-id: ${{ steps.run.outputs.run_id }}
          github-token: ${{ github.token }}
          path: incoming-science
      - name: Copy reproducible model-derived SVG and CSV outputs to the GitHub gallery
        run: |
          set -euo pipefail
          mkdir -p docs/science
          for name in rocket_ascent_demo.svg orbit_altitude_demo.svg orbit_latitude_demo.svg space_weather_kp_demo.svg telemetry_temperature_demo.svg telemetry_voltage_demo.svg rocket_velocity_demo.svg rocket_dynamic_pressure_demo.svg atmosphere_density_demo.svg rocket_thrust_sensitivity_demo.svg; do
            match=$(find incoming-science -type f -name "$name" -print -quit)
            test -n "$match"
            python3 - "$match" <<'PY'
          import sys
          from xml.etree import ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          assert root.tag == "{http://www.w3.org/2000/svg}svg"
          PY
            cp "$match" "docs/science/$name"
          done
          for name in orbit_track_demo.csv satellite_telemetry_demo.csv rocket_trajectory_demo.csv rocket_thrust_sensitivity_demo.csv mission_snapshot_demo.json; do
            match=$(find incoming-science -type f -name "$name" -print -quit)
            test -n "$match"
            cp "$match" "docs/science/$name"
          done
          printf '%s\n'             '# Deterministic scientific charts generated by AstraSentinel AI'             ''             'All 15 files here are output of the real Python scientific modules in **ASTRA_OFFLINE=1** mode, tested by GitHub Actions.'             ''             'Historical bundled 2024 TLE (orbit), synthetic illustrative historical Kp and seeded entirely synthetic telemetry are used. Rocket curves are computed by a simplified educational 1D numerical solver.'             ''             'These graphs are **not current space mission readings, launch certification, or genuine spacecraft health telemetry**.'             ''             '| Model-produced graph | Interpretation |'             '|---|---|'             '| [Orbit estimated altitude](orbit_altitude_demo.svg) | Historical SGP4 demo elements |'             '| [Estimated orbital latitude](orbit_latitude_demo.svg) | Approximate Earth-fixed latitude |'             '| [Rocket altitude](rocket_ascent_demo.svg) | 1D educational flight case |'             '| [Rocket vertical speed](rocket_velocity_demo.svg) | 1D numerical simulation |'             '| [Rocket dynamic pressure](rocket_dynamic_pressure_demo.svg) | 1D drag/loading estimate |'             '| [Rocket thrust sensitivity](rocket_thrust_sensitivity_demo.svg) | Deterministic one-factor parameter experiment |'             '| [Modeled atmospheric density](atmosphere_density_demo.svg) | Simplified exponential density model |'             '| [Synthetic space weather Kp](space_weather_kp_demo.svg) | Not an observed current NOAA event |'             '| [Synthetic telemetry temperature](telemetry_temperature_demo.svg) | Artificial satellite health values |'             '| [Synthetic telemetry voltage](telemetry_voltage_demo.svg) | Artificial satellite health values |'             ''             'Four CSV files and the source-attributed mission JSON snapshot are provided alongside the charts.'             > docs/science/README.md
      - name: Check and copy ONLY the four expected captures
        run: |
          set -euo pipefail
          mkdir -p docs/screenshots
          for name in 01-mission-overview.png 02-rocket-comparison.png 03-rocket-lab.png 04-orbit-ground-track.png; do
            match=$(find incoming -type f -name "$name" -print -quit)
            if [ -z "$match" ]; then
              echo "::error::Verified browser capture missing: $name"
              exit 1
            fi
            # PNG signature verification; reject accidental HTML/trace files.
            python3 - "$match" <<'PY'
          import sys
          with open(sys.argv[1], "rb") as f:
              assert f.read(8) == b"\x89PNG\r\n\x1a\n"
          PY
            cp "$match" "docs/screenshots/$name"
          done
          printf '%s\n'             '# Real AstraSentinel AI browser screenshots'             ''             'These four PNGs were captured from a **running offline Docker Compose application** using Playwright/Chromium, NOT image-generation mockups.'             ''             '- [Mission Overview](01-mission-overview.png)'             '- [Rocket Scenario Comparison](02-rocket-comparison.png)'             '- [Rocket Lab](03-rocket-lab.png)'             '- [3D Orbital Explorer and computed ground track](04-orbit-ground-track.png)'             ''             'The underlying ISS orbit uses the bundled **historical demo TLE**, space weather is **synthetic historical demo** data and spacecraft telemetry is **entirely synthetic**. These screenshots are not real spacecraft operations.'             > docs/screenshots/README.md
      - name: Commit screenshot gallery to the public source repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/ docs/science/
          if git diff --cached --quiet; then
            echo "Dashboard screenshots unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "docs: publish verified browser screenshots and real scientific graphs [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
